
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="container">

        <header>
            <h1>Spend<span>Wise</span></h1>
            <p>Personal Finance Dashboard</p>
        </header>

        <section class="summary">

            <div class="card">
                <p>Total Balance</p>
                <h2 id="balance">Rs. 0.00</h2>
            </div>

            <div class="card">
                <p>Total Income</p>
                <h2 id="income">Rs. 0.00</h2>
            </div>

            <div class="card">
                <p>Total Expenses</p>
                <h2 id="expense">Rs. 0.00</h2>
            </div>

        </section>

        <section class="main-content">

            <div class="panel">
                <h2>Add Transaction</h2>

                <form id="transaction-form">

                    <label>Description</label>
                    <input type="text" id="description"
                        placeholder="e.g. Food" required>

                    <label>Amount (Rs.)</label>
                    <input type="number" id="amount"
                        placeholder="Enter amount" min="0.01"
                        step="0.01" required>

                    <label>Category</label>
                    <select id="category">
                        <option>Food</option>
                        <option>Transport</option>
                        <option>Education</option>
                        <option>Shopping</option>
                        <option>Other</option>
                    </select>

                    <label>Transaction Type</label>
                    <select id="type">
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>

                    <button type="submit">Add Transaction</button>

                </form>
            </div>

            <div class="panel">
                <h2>Expense Overview</h2>
                <canvas id="expenseChart"></canvas>
            </div>

        </section>

        <section class="panel history">
            <h2>Recent Transactions</h2>

            <div id="transaction-list">
                <p class="empty">No transactions yet.</p>
            </div>
        </section>

        <footer>
            <p>SpendWise | Personal Finance Management</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
